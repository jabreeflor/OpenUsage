<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Final · Menu bar and dropdown</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#93C5FD}a:hover{color:#BFDBFE}
</style>
</helmet>
<div style="width: 460px; height: 860px; box-sizing: border-box; background: #2E333C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Inter, sans-serif; color: #F3F4F6; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased">
  <div style="height: 28px; flex-shrink: 0; background: #1D2026; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 10px; font-size: 13px">
    <button type="button" aria-label="{{ barLabel }}" style="height: 22px; padding: 0 8px; border: 0; border-radius: 5px; background: rgba(255,255,255,0.2); display: flex; gap: 9px; align-items: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700">
      <sc-for list="{{ tiles }}" as="b" hint-placeholder-count="5">
        <span style="display: flex; gap: 3px; align-items: center; color: {{ b.barColor }}"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ b.logo }}" fill="#FFFFFF"></path></svg>{{ b.pctText }}</span>
      </sc-for>
    </button>
    <span>Thu 1:42 PM</span>
  </div>

  <div style="margin: 6px 10px 0 auto; width: 380px; background: #17191E; border: 1px solid #30343C; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.55); padding: 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; font-weight: 700">Usage</span>
      <span style="font-size: 11px; color: #A1A1AA">updated 1 min ago</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{ t.selected }}" onClick="{{ t.pick }}" style="padding: 12px 6px 10px; border-radius: 12px; font: inherit; color: #F3F4F6; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; {{ t.tileStyle }}">
          <span style="position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center">
            <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="{{ t.ringLabel }}" style="position: absolute; top: 0; left: 0"><circle cx="32" cy="32" r="27" stroke="#2A2E36" stroke-width="6" fill="none"></circle><circle cx="32" cy="32" r="27" stroke="{{ t.color }}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="{{ t.dash }}" transform="rotate(-90 32 32)"></circle></svg>
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ t.logo }}" fill="#F3F4F6"></path></svg>
          </span>
          <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 17px; font-weight: 700; color: {{ t.color }}">{{ t.pctText }}</span>
          <span style="font-size: 11px; color: #D4D4D8">{{ t.name }}</span>
          <span style="font-size: 10px; color: #A1A1AA">{{ t.worstLabel }}</span>
        </button>
      </sc-for>
      <div style="padding: 12px 8px 10px; border-radius: 12px; background: #1F2228; display: flex; flex-direction: column; justify-content: space-between; gap: 6px">
        <span style="font-size: 10px; color: #A1A1AA; text-transform: uppercase; letter-spacing: 0.06em">Today</span>
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 20px; font-weight: 700">1.84M</span>
        <div style="height: 26px; display: flex; align-items: flex-end; gap: 2px" aria-hidden="true">
          <sc-for list="{{ spark }}" as="s" hint-placeholder-count="12">
            <span style="flex: 1; border-radius: 1px; background: #52525B; {{ s.h }}"></span>
          </sc-for>
        </div>
        <span style="font-size: 10px; color: #A1A1AA">tokens · 412 requests</span>
      </div>
    </div>

    <div style="border-radius: 12px; background: #1F2228; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ sel.logo }}" fill="#F3F4F6"></path></svg>
        <span style="font-size: 13px; font-weight: 700">{{ sel.name }}</span>
        <span style="font-size: 11px; color: #A1A1AA">{{ sel.plan }}</span>
      </div>
      <sc-for list="{{ sel.limits }}" as="l" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 12px">
            <span style="color: #D4D4D8">{{ l.label }}</span>
            <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; color: {{ l.color }}">{{ l.pctText }}</span>
          </div>
          <div style="height: 6px; border-radius: 3px; background: #2A2E36"><div style="height: 6px; border-radius: 3px; {{ l.bar }}"></div></div>
          <span style="font-size: 10px; color: #A1A1AA">{{ l.meta }}</span>
        </div>
      </sc-for>
      <div style="border-top: 1px solid #30343C; padding-top: 10px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 10px; color: #A1A1AA; text-transform: uppercase; letter-spacing: 0.06em">Models today · {{ sel.today }} tokens</span>
        <div style="height: 8px; display: flex; gap: 2px; border-radius: 4px; overflow: hidden">
          <sc-for list="{{ sel.models }}" as="m" hint-placeholder-count="3">
            <span style="{{ m.seg }}"></span>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 4px 12px">
          <sc-for list="{{ sel.models }}" as="m" hint-placeholder-count="3">
            <span style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #D4D4D8"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{ m.c }}"></span>{{ m.name }} <span style="color: #A1A1AA">{{ m.share }}</span></span>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; font-size: 12px; padding: 0 2px">
      <a href="FinalStats.dc.html">Statistics</a>
      <a href="FinalAccounts.dc.html">Accounts</a>
      <a href="#quit">Quit</a>
    </div>
  </div>
</div>
</x-dc>
