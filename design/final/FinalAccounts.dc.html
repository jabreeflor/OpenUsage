<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Final · Accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4D4D8}a:hover{color:#FFFFFF}
@keyframes ou-spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 780px; height: 620px; box-sizing: border-box; background: #17191E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Inter, sans-serif; color: #F3F4F6; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; box-shadow: inset 0 0 0 1px #30343C; -webkit-font-smoothing: antialiased">
  <div style="padding: 10px 16px 8px; border-bottom: 1px solid #262A31; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span>
      <span style="flex: 1; text-align: center; font-size: 13px; font-weight: 600; margin-right: 52px">Accounts</span>
    </div>
    <div role="tablist" aria-label="Settings" style="display: flex; justify-content: center; gap: 4px">
      <button type="button" role="tab" aria-selected="false" style="width: 84px; height: 48px; border: 0; border-radius: 8px; background: transparent; color: #A1A1AA; font: inherit; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" stroke="#A1A1AA" stroke-width="1.4" fill="none"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="#A1A1AA" stroke-width="1.4" stroke-linecap="round"></path></svg>General</button>
      <button type="button" role="tab" aria-selected="true" style="width: 84px; height: 48px; border: 0; border-radius: 8px; background: #262A32; color: #F3F4F6; font: inherit; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" stroke="#F3F4F6" stroke-width="1.4" fill="none"></circle><path d="M2.5 14c.8-2.6 3-4 5.5-4s4.7 1.4 5.5 4" stroke="#F3F4F6" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg>Accounts</button>
      <button type="button" role="tab" aria-selected="false" style="width: 84px; height: 48px; border: 0; border-radius: 8px; background: transparent; color: #A1A1AA; font: inherit; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.2 1.5H2.8zM6.5 14a1.6 1.6 0 0 0 3 0" stroke="#A1A1AA" stroke-width="1.4" fill="none" stroke-linejoin="round"></path></svg>Alerts</button>
    </div>
  </div>

  <div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 10px; color: #A1A1AA; text-transform: uppercase; letter-spacing: 0.06em">Subscriptions</span>
      <div style="background: #1F2228; border-radius: 12px; overflow: hidden">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #262A31">
            <span style="position: relative; width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
              <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; top: 0; left: 0"><circle cx="20" cy="20" r="16" stroke="#2A2E36" stroke-width="4" fill="none"></circle><circle cx="20" cy="20" r="16" stroke="{{ r.ring }}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="{{ r.dash }}" transform="rotate(-90 20 20)"></circle></svg>
              <svg width="15" height="15" viewBox="0 0 24 24" role="img" aria-label="{{ r.name }} logo"><path d="{{ r.logo }}" fill="{{ r.logoFill }}"></path></svg>
            </span>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 13px; font-weight: 600">{{ r.name }} <span style="font-weight: 400; color: #A1A1AA">{{ r.plan }}</span></span>
              <span style="font-size: 11px; color: #A1A1AA">{{ r.how }}</span>
            </div>
            <span style="width: 40px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; color: {{ r.ring }}">{{ r.pctText }}</span>
            <span style="min-width: 84px; text-align: center; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; {{ r.pill }}">{{ r.status }}</span>
            <button type="button" onClick="{{ r.act }}" style="width: 104px; height: 30px; box-sizing: border-box; border-radius: 7px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; {{ r.btn }}">
              <sc-if value="{{ r.busy }}" hint-placeholder-val="{{ false }}"><span style="width: 11px; height: 11px; box-sizing: border-box; border-radius: 6px; border: 2px solid rgba(161,161,170,0.35); border-top-color: #D4D4D8; animation: ou-spin 0.8s linear infinite"></span></sc-if>{{ r.label }}
            </button>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 10px; color: #A1A1AA; text-transform: uppercase; letter-spacing: 0.06em">Count tokens from local tools</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px">
        <sc-for list="{{ sources }}" as="s" hint-placeholder-count="5">
          <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 12px; padding: 2px 0">
            <input type="checkbox" checked="{{ s.on }}" style="margin: 1px 0 0; width: 15px; height: 15px; accent-color: #E4E4E7">
            <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 500">{{ s.name }}</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #A1A1AA">{{ s.path }}</span></span>
          </label>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid #262A31; font-size: 12px; color: #D4D4D8">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="color: #A1A1AA">Colors</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FACC15"></span>Yellow from</span>
        <label style="display: flex; align-items: center; gap: 4px"><input type="number" value="50" aria-label="Yellow threshold percent" style="width: 46px; height: 24px; box-sizing: border-box; border-radius: 6px; border: 1px solid #3F434C; background: #262A32; color: #F3F4F6; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; padding: 0 6px">%</label>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F87171"></span>Red from</span>
        <label style="display: flex; align-items: center; gap: 4px"><input type="number" value="80" aria-label="Red threshold percent" style="width: 46px; height: 24px; box-sizing: border-box; border-radius: 6px; border: 1px solid #3F434C; background: #262A32; color: #F3F4F6; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; padding: 0 6px">%</label>
      </div>
      <span style="font-size: 11px; color: #A1A1AA">Credentials stay in your Keychain</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"buttonStyle":{"editor":"enum","options":["light","graphite","outline"],"default":"light"},"$preview":{"width":780,"height":620}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { st: { claude: 'ok', chatgpt: 'ok', cursor: 'ok', gemini: 'needs', opencode: 'off' } };
  }
  setOne(id, v) {
    this.setState({ st: { ...this.state.st, [id]: v } });
  }
  renderVals() {
    const LOGOS = {"claude": "m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z", "chatgpt": "M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z", "cursor": "M11.503.131 1.891 5.678a.84.84 0 0 0-.42.726v11.188c0 .3.162.575.42.724l9.609 5.55a1 1 0 0 0 .998 0l9.61-5.55a.84.84 0 0 0 .42-.724V6.404a.84.84 0 0 0-.42-.726L12.497.131a1.01 1.01 0 0 0-.996 0M2.657 6.338h18.55c.263 0 .43.287.297.515L12.23 22.918c-.062.107-.229.064-.229-.06V12.335a.59.59 0 0 0-.295-.51l-9.11-5.257c-.109-.063-.064-.23.061-.23", "gemini": "M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81", "opencode": "M22 24H2V0h20zM17 4.8H7v14.4h10z"};
    const heat = (p) => (p >= 80 ? '#F87171' : p >= 50 ? '#FACC15' : '#4ADE80');
    const C = 2 * Math.PI * 16;
    const style = this.props.buttonStyle ?? 'light';
    const PRIMARY = {
      light: 'background: #F4F4F5; border: 1px solid #F4F4F5; color: #17191E',
      graphite: 'background: #3F434C; border: 1px solid #52525B; color: #FFFFFF',
      outline: 'background: transparent; border: 1px solid #A1A1AA; color: #F3F4F6'
    }[style];
    const QUIET = 'background: transparent; border: 1px solid #3F434C; color: #D4D4D8';
    const BUSY = 'background: #262A32; border: 1px solid #3F434C; color: #A1A1AA';
    const info = [
      ['claude', 'Claude', 'Max 5x', 81, 'Signed in with claude.ai'],
      ['chatgpt', 'ChatGPT', 'Plus · Codex', 54, 'Signed in with ChatGPT'],
      ['cursor', 'Cursor', 'Pro', 67, 'Using the Cursor app session on this Mac'],
      ['gemini', 'Gemini', 'Google AI Pro', 21, 'Signed in with Google'],
      ['opencode', 'OpenCode', 'Zen', 42, 'Signed in with OpenCode']
    ];
    const rows = info.map(([id, name, plan, pct, okHow]) => {
      const s = this.state.st[id];
      const ok = s === 'ok';
      const pill = {
        ok: ['Connected', 'background: rgba(74,222,128,0.14); color: #4ADE80'],
        needs: ['Needs sign-in', 'background: rgba(250,204,21,0.14); color: #FACC15'],
        off: ['Off', 'background: #2A2E36; color: #A1A1AA'],
        busy: ['Connecting', 'background: #2A2E36; color: #D4D4D8']
      }[s];
      return {
        name, plan: s === 'off' ? '' : plan, logo: LOGOS[id], logoFill: ok ? '#F3F4F6' : '#71717A',
        ring: ok ? heat(pct) : '#2A2E36', dash: ok ? (C * pct / 100).toFixed(1) + ' ' + C.toFixed(1) : '0 ' + C.toFixed(1),
        pctText: ok ? pct + '%' : '',
        how: ok ? okHow : s === 'needs' ? 'Sign-in expired yesterday' : s === 'busy' ? 'Finish signing in in your browser' : 'Not connected',
        status: pill[0], pill: pill[1],
        busy: s === 'busy',
        label: ok ? 'Sign out' : s === 'needs' ? 'Reconnect' : s === 'busy' ? 'Waiting' : 'Sign in',
        btn: ok ? QUIET : s === 'busy' ? BUSY : PRIMARY,
        act: () => {
          if (ok) return this.setOne(id, 'off');
          if (s === 'busy') return;
          this.setOne(id, 'busy');
          setTimeout(() => this.setOne(id, 'ok'), 1600);
        }
      };
    });
    const sources = [
      { name: 'Claude Code', path: '~/.claude/projects', on: true },
      { name: 'Codex CLI', path: '~/.codex/sessions', on: true },
      { name: 'Gemini CLI', path: '~/.gemini/tmp', on: true },
      { name: 'OpenCode', path: '~/.local/share/opencode', on: false },
      { name: 'Cursor', path: 'from your Cursor account', on: true }
    ];
    return { rows, sources };
  }
}
</script>
</body>
</html>
